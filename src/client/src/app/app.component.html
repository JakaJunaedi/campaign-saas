<div class="min-h-screen flex flex-col bg-slate-900 text-slate-100">
  <!-- Top Navigation Bar -->
  <header class="h-16 border-b border-slate-800 bg-slate-950/80 backdrop-blur px-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
        CS
      </div>
      <div>
        <h1 class="text-sm font-semibold text-white tracking-wide">Campaign SaaS</h1>
        <p class="text-xs text-slate-400">Influencer & KOL Agency Platform</p>
      </div>
    </div>

    <!-- Backend Status Indicator -->
    <div class="flex items-center gap-3 bg-slate-900 border border-slate-800 rounded-full px-4 py-1.5 text-xs">
      <span class="flex h-2 w-2 rounded-full"
        [ngClass]="{
          'bg-amber-400 animate-pulse': apiStatus() === 'checking',
          'bg-emerald-400': apiStatus() === 'online',
          'bg-rose-400': apiStatus() === 'offline'
        }">
      </span>
      <span class="text-slate-300 font-mono">{{ apiMessage() }}</span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8">
    <router-outlet></router-outlet>
  </main>
</div>
